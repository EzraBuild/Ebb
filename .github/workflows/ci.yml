name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test -c Release

  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Ebb.Linux.Tests -c Release

      - name: Build the tarball, .deb and .rpm
        run: |
          sudo apt-get install -y -qq rpm xvfb > /dev/null
          sh packaging/linux/build-all.sh 0.0.0 ${{ matrix.arch }} dist

      - name: Install each one and start it on a fresh account
        run: sh packaging/linux/smoke-test.sh dist 0.0.0 ${{ matrix.arch }}
