name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test -c Release

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Ebb.Linux.Tests -c Release
